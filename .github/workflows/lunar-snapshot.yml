
name: Lunar Window Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Photograph Lunar Window
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({
                viewport: { width: 1300, height: 1000 },
                deviceScaleFactor: 1
              });

              await page.goto(
                'https://auntiemoon.github.io/lunar-window/',
                { waitUntil: 'load', timeout: 60000 }
              );

              await page.waitForFunction(
                () => {
                  const text = document.body.innerText;
                  return !text.includes('Calculating') &&
                    /Illumination/i.test(text) &&
                    /\d+(?:\.\d+)?%/.test(text);
                },
                { timeout: 60000 }
              );

              await page.locator('.scene').screenshot({
                path: 'lunar-window.png',
                animations: 'disabled'
              });

              console.log('Lunar photograph captured!');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Save updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunar-window.png
          if ! git diff --cached --quiet; then
            git commit -m "Update lunar snapshot"
            git push
          fi
